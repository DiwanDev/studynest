<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}StudyNest{% endblock %}</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
    <header class="navbar">
        <div class="container nav-content">
            <a class="logo" href="{{ url_for('home') }}">
                Study<span>Nest</span>
            </a>

            <nav>
                <a
                    class="{% if request.endpoint == 'home' %}active{% endif %}"
                    href="{{ url_for('home') }}"
                 >
                        Home
                 </a>

                <a
                        class="{% if request.endpoint == 'task_list' %}active{% endif %}"
                         href="{{ url_for('task_list') }}"
                >
                        Tasks
    </a>
</nav>
        </div>
    </header>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer>
        <div class="container">
            <p>StudyNest — Learn Flask one step at a time.</p>
        </div>
    </footer>
</body>
</html>
