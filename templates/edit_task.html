{% extends "base.html" %}

{% block title %}Edit Task | StudyNest{% endblock %}

{% block content %}
<section class="form-page">
    <div class="form-container">
        <div class="form-heading">
            <p class="eyebrow">UPDATE STUDY TASK</p>
            <h1>Edit your task</h1>

            <p>
                Change the information below and save your updates.
            </p>
        </div>

        {% if error %}
            <div class="error-message">
                {{ error }}
            </div>
        {% endif %}

        <form
            class="task-form"
            action="{{ url_for('edit_task', task_id=task_id) }}"
            method="POST"
        >
            <div class="form-group">
                <label for="title">Task title</label>

                <input
                    id="title"
                    name="title"
                    type="text"
                    value="{{ form_data.get('title', '') }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>

                <select id="subject" name="subject" required>
                    <option value="">Choose a subject</option>

                    <option
                        value="Python"
                        {% if form_data.get('subject') == 'Python' %}
                            selected
                        {% endif %}
                    >
                        Python
                    </option>

                    <option
                        value="Advanced Java"
                        {% if form_data.get('subject') == 'Advanced Java' %}
                            selected
                        {% endif %}
                    >
                        Advanced Java
                    </option>

                    <option
                        value="DAA"
                        {% if form_data.get('subject') == 'DAA' %}
                            selected
                        {% endif %}
                    >
                        DAA
                    </option>

                    <option
                        value="Web Development"
                        {% if form_data.get('subject') == 'Web Development' %}
                            selected
                        {% endif %}
                    >
                        Web Development
                    </option>

                    <option
                        value="Other"
                        {% if form_data.get('subject') == 'Other' %}
                            selected
                        {% endif %}
                    >
                        Other
                    </option>
                </select>
            </div>

            <div class="form-group">
                <label for="due_date">Due date</label>

                <input
                    id="due_date"
                    name="due_date"
                    type="date"
                    value="{{ form_data.get('due_date', '') }}"
                    required
                >
            </div>

            <div class="form-actions">
                <a
                    class="secondary-button"
                    href="{{ url_for('task_list') }}"
                >
                    Cancel
                </a>

                <button class="primary-button form-submit" type="submit">
                    Save Changes
                </button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
